<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>XR 户外导航</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    /* initAR 会接管 #app，将 Three.js canvas 注入其中 */
    #app {
      position: fixed;
      inset: 0;
    }

    /* 右上角位置列表 HUD —— 必须在 #app 内部 */
    #hud {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      pointer-events: auto;
      user-select: none;
    }

    .hud-panel {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      min-width: 160px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .hud-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #a0e0ff;
      letter-spacing: 0.5px;
    }

    #location-list {
      list-style: none;
    }

    .location-item {
      padding: 10px 12px;
      margin: 4px 0;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s, transform 0.1s;
      border: 1px solid transparent;
    }

    .location-item:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .location-item:active {
      transform: scale(0.98);
    }

    .location-item.selected {
      background: rgba(0, 200, 100, 0.25);
      border-color: rgba(0, 255, 120, 0.6);
      color: #90ffb0;
    }

    /* 接近目标时的绿色闪烁遮板 —— 同样必须在 #app 内部 */
    #proximity-flash {
      position: fixed;
      inset: 0;
      z-index: 900;
      pointer-events: none;
      background: rgba(0, 255, 80, 0);
      transition: background 0.15s ease-in-out;
    }

    /* 底部状态栏 */
    #status-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      color: #ccc;
      font-size: 12px;
      pointer-events: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }

    #status-bar.ready {
      color: #80ffa0;
      border-color: rgba(0, 255, 100, 0.3);
    }

    #status-bar.navigating {
      color: #a0e0ff;
      border-color: rgba(100, 200, 255, 0.3);
    }

    /* 启动提示屏 */
    #start-prompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      text-align: center;
      color: #fff;
      pointer-events: auto;
    }

    #start-prompt button {
      padding: 14px 32px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #00c864, #00a0ff);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 200, 100, 0.4);
    }

    #start-prompt button:active {
      transform: scale(0.96);
    }

    #start-prompt button:disabled {
      background: #555;
      box-shadow: none;
      cursor: not-allowed;
    }

    #start-prompt p {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <!--
    #app 是 initAR 的容器。
    HUD、闪烁遮板、状态栏都必须嵌套在 #app 内部，
    否则进入 AR 会话后它们会静默消失。
  -->
  <div id="app">
    <!-- 右上角位置列表 HUD -->
    <div id="hud">
      <div class="hud-panel">
        <div class="hud-title">📍 选择目的地</div>
        <ul id="location-list">
          <li
            class="location-item"
            data-lat="31.2304"
            data-lng="121.4737"
            data-name="人民广场"
          >
            人民广场
          </li>
          <li
            class="location-item"
            data-lat="31.2310"
            data-lng="121.4745"
            data-name="外滩观景台"
          >
            外滩观景台
          </li>
          <li
            class="location-item"
            data-lat="31.2295"
            data-lng="121.4720"
            data-name="南京路步行街"
          >
            南京路步行街
          </li>
        </ul>
      </div>
    </div>

    <!-- 接近目标时的绿色闪烁遮板 -->
    <div id="proximity-flash"></div>

    <!-- 底部状态栏 -->
    <div id="status-bar">正在初始化...</div>

    <!-- 启动提示屏 -->
    <div id="start-prompt">
      <button id="start-btn">进入 AR 导航</button>
      <p>请确保在户外使用，需要相机和定位权限</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
