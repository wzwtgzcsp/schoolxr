<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XR 户外导航</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #app { width: 100%; height: 100%; position: relative; }

    /* 右上角位置列表 HUD —— 必须放在 #app 内部才能在 AR 会话中可见 */
    #hud {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      font-family: system-ui, -apple-system, sans-serif;
      pointer-events: auto;
      user-select: none;
    }

    .hud-panel {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 12px;
      color: #fff;
      min-width: 160px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .hud-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #a0e0ff;
      letter-spacing: 0.5px;
    }

    .location-item {
      padding: 10px 12px;
      margin: 4px 0;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s, transform 0.1s;
      border: 1px solid transparent;
    }

    .location-item:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .location-item:active {
      transform: scale(0.98);
    }

    .location-item.selected {
      background: rgba(0, 200, 100, 0.25);
      border-color: rgba(0, 255, 120, 0.6);
      color: #90ffb0;
    }

    /* 接近目标时的绿色闪烁遮板 —— 同样必须在 #app 内部 */
    #proximity-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 900;
      pointer-events: none;
      background: rgba(0, 255, 80, 0);
      transition: background 0.15s ease-in-out;
    }

    #status-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      color: #ccc;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      pointer-events: auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #status-bar.ready { color: #80ffa0; border-color: rgba(0, 255, 100, 0.3); }
    #status-bar.navigating { color: #a0e0ff; border-color: rgba(100, 200, 255, 0.3); }

    #start-prompt {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2000;
      text-align: center;
      color: #fff;
      font-family: system-ui, sans-serif;
      pointer-events: auto;
    }

    #start-prompt button {
      padding: 14px 32px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #00c864, #00a0ff);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 200, 100, 0.4);
    }

    #start-prompt button:active { transform: scale(0.96); }

    #start-prompt p {
      margin-top: 12px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- 右上角位置列表 HUD -->
    <div id="hud">
      <div class="hud-panel">
        <div class="hud-title">📍 选择目的地</div>
        <ul id="location-list" style="list-style:none;">
          <li class="location-item" data-lat="31.2304" data-lng="121.4737" data-name="人民广场">人民广场</li>
          <li class="location-item" data-lat="31.2310" data-lng="121.4745" data-name="外滩观景台">外滩观景台</li>
          <li class="location-item" data-lat="31.2295" data-lng="121.4720" data-name="南京路步行街">南京路步行街</li>
        </ul>
      </div>
    </div>

    <!-- 接近目标时的绿色闪烁遮板 -->
    <div id="proximity-flash"></div>

    <!-- 底部状态栏 -->
    <div id="status-bar">正在初始化...</div>

    <!-- 启动提示 -->
    <div id="start-prompt">
      <button id="start-btn">进入 AR 导航</button>
      <p>请确保在户外使用，需要相机和定位权限</p>
    </div>
  </div>

  <script type="module">
    // ===== 导入框架 =====
    // 注意：实际部署时需要通过 npm 安装这些包，然后使用打包工具（如 Vite）
    // 以下为示意性导入，实际项目中应使用：
    // import { initAR, createGpsAnchor, approxDistanceMetres } from 'gps-plus-slam-app-framework';
    // import { startGpsWatch } from 'gps-plus-slam-app-framework/sensors';

    // 为了演示，我们使用全局变量占位，实际开发中请正确导入
    const { initAR, createGpsAnchor, approxDistanceMetres } = window.GpsPlusSlamFramework || {};
    const { startGpsWatch } = window.GpsPlusSlamFramework?.sensors || {};

    // ===== 状态管理 =====
    const state = {
      arReady: false,
      navigating: false,
      currentTarget: null, // { lat, lng, name }
      currentUserPos: null, // { lat, lng }
      userMarker: null, // 用户位置的 3D 标记
      targetMarker: null, // 目标位置的 3D 标记
      pathLine: null, // 路径线
      pathArrows: [], // 路径上的箭头
      proximityThreshold: 10, // 接近目标的距离阈值（米）
      flashInterval: null,
    };

    // ===== DOM 引用 =====
    const statusBar = document.getElementById('status-bar');
    const proximityFlash = document.getElementById('proximity-flash');
    const startPrompt = document.getElementById('start-prompt');
    const startBtn = document.getElementById('start-btn');
    const locationItems = document.querySelectorAll('.location-item');

    // ===== 工具函数 =====
    function setStatus(text, cls = '') {
      statusBar.textContent = text;
      statusBar.className = cls;
    }

    // ===== 启动 AR =====
    async function startAR() {
      startPrompt.style.display = 'none';
      setStatus('正在启动 AR...', '');

      try {
        // 检查 WebXR 支持
        if (!navigator.xr) {
          setStatus('此设备不支持 WebXR', '');
          return;
        }
        const supported = await navigator.xr.isSessionSupported('immersive-ar');
        if (!supported) {
          setStatus('此设备不支持 AR 模式', '');
          return;
        }

        // 初始化 AR 场景（框架会自动处理 Three.js 场景和相机）
        await initAR(document.getElementById('app'), false, {
          requestHitTest: true,
        });

        state.arReady = true;
        setStatus('AR 已就绪，请走动几步以完成定位', 'ready');

        // 启动 GPS 监听
        if (startGpsWatch) {
          startGpsWatch(
            (position) => {
              state.currentUserPos = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };
              // GPS 更新时检查是否接近目标
              checkProximity();
            },
            (error) => {
              console.warn('GPS 错误:', error);
            }
          );
        }

        // 绑定位置列表点击
        locationItems.forEach((item) => {
          item.addEventListener('click', () => selectTarget(item));
        });

      } catch (err) {
        console.error('AR 启动失败:', err);
        setStatus('AR 启动失败: ' + err.message, '');
        startPrompt.style.display = 'block';
      }
    }

    // ===== 选择目标 =====
    function selectTarget(item) {
      // 更新 UI 选中状态
      locationItems.forEach((i) => i.classList.remove('selected'));
      item.classList.add('selected');

      const lat = parseFloat(item.dataset.lat);
      const lng = parseFloat(item.dataset.lng);
      const name = item.dataset.name;

      state.currentTarget = { lat, lng, name };
      state.navigating = true;

      setStatus(`导航中: ${name}`, 'navigating');

      // 更新 3D 导航视觉
      updateNavigationVisuals();

      // 立即检查一次接近状态
      checkProximity();
    }

    // ===== 更新导航视觉（路径 + 箭头） =====
    function updateNavigationVisuals() {
      if (!state.currentTarget || !state.currentUserPos) return;

      // 注意：实际项目中，这里需要使用 createGpsAnchor 来将 3D 物体锚定到 GPS 坐标
      // 以下代码为逻辑示意，具体 API 调用请参考框架文档

      // 1. 在目标位置放置标记（使用 createGpsAnchor）
      // if (state.targetMarker) {
      //   // 移除旧标记
      // }
      // state.targetMarker = createGpsAnchor({
      //   lat: state.currentTarget.lat,
      //   lng: state.currentTarget.lng,
      //   object: createTargetMesh(), // 创建一个球体或旗帜
      // });

      // 2. 绘制从用户到目标的路径（带箭头的线）
      // 框架提供了 approxDistanceMetres 来计算距离
      // 路径的每个点都可以通过插值计算，然后用 createGpsAnchor 锚定

      // 3. 为了简化，这里先只做逻辑演示
      console.log('导航目标:', state.currentTarget);
      console.log('用户位置:', state.currentUserPos);

      // 计算距离
      if (approxDistanceMetres && state.currentUserPos) {
        const dist = approxDistanceMetres(
          { lat: state.currentUserPos.lat, lng: state.currentUserPos.lng },
          { lat: state.currentTarget.lat, lng: state.currentTarget.lng }
        );
        setStatus(`导航中: ${state.currentTarget.name} — 距离 ${dist.toFixed(0)} 米`, 'navigating');
      }
    }

    // ===== 检查是否接近目标 =====
    function checkProximity() {
      if (!state.navigating || !state.currentTarget || !state.currentUserPos) {
        return;
      }

      if (!approxDistanceMetres) return;

      const dist = approxDistanceMetres(
        { lat: state.currentUserPos.lat, lng: state.currentUserPos.lng },
        { lat: state.currentTarget.lat, lng: state.currentTarget.lng }
      );

      if (dist <= state.proximityThreshold) {
        startProximityFlash();
      } else {
        stopProximityFlash();
      }
    }

    // ===== 绿色闪烁效果 =====
    function startProximityFlash() {
      if (state.flashInterval) return; // 已经在闪烁

      let visible = false;
      state.flashInterval = setInterval(() => {
        visible = !visible;
        proximityFlash.style.background = visible
          ? 'rgba(0, 255, 80, 0.25)'
          : 'rgba(0, 255, 80, 0)';
      }, 300); // 每 300ms 闪烁一次
    }

    function stopProximityFlash() {
      if (state.flashInterval) {
        clearInterval(state.flashInterval);
        state.flashInterval = null;
      }
      proximityFlash.style.background = 'rgba(0, 255, 80, 0)';
    }

    // ===== 启动按钮 =====
    startBtn.addEventListener('click', startAR);

    // 页面加载后检查能力
    window.addEventListener('load', async () => {
      if (!navigator.xr) {
        setStatus('此设备/浏览器不支持 WebXR', '');
        startBtn.disabled = true;
        startBtn.textContent = '设备不支持';
        return;
      }
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!supported) {
        setStatus('此设备不支持 AR 模式', '');
        startBtn.disabled = true;
        startBtn.textContent = '设备不支持';
      } else {
        setStatus('准备就绪', 'ready');
      }
    });
  </script>
</body>
</html>
